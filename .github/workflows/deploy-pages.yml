# Build Next.js static export and deploy to GitHub Pages (stockcontext JSON from R2 cache).
name: Deploy Stock Context to GitHub Pages

on:
  push:
    branches: [main]
  # Three daily passes (as_of skip gate skips full builds when unchanged):
  #   ~2:30 AM ET — after 2 AM feeds-only publish
  #   ~9:00 AM ET — primary morning, ~3h after 6 AM full publish
  #   ~10:30 AM ET — safety net if publish finished after primary
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 13 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even if manifest.as_of unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stockcontext-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/stockcontext-public
          key: stockcontext-public-v5
          restore-keys: stockcontext-public-v5
      - name: Decide if build is needed
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: node scripts/ci-should-build.mjs

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/stockcontext-public
          key: stockcontext-public-v5
          restore-keys: stockcontext-public-v5
      - run: npm ci
      - name: Sync public JSON from R2
        env:
          STOCKTHEMES_SYNC_VIA_R2: "1"
          STOCKCONTEXT_SYNC_CONCURRENCY: "48"
        run: node scripts/sync-stockcontext-ci.mjs
      - name: Build static export
        env:
          CI: "true"
          # Apex custom domain (stockcontext.info): leave NEXT_PUBLIC_BASE_PATH empty.
          # Legacy github.io project URL: set var to /MosaicBot_StockContext
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://stockcontext.info' }}
          NEXT_PUBLIC_DATA_BASE_URL: ${{ vars.NEXT_PUBLIC_DATA_BASE_URL || 'https://storage.stockthemes.ai/stockcontext/' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build && node scripts/write-pages-deploy-meta.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  skip_notice:
    needs: check
    if: needs.check.outputs.should_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pages deploy skipped — manifest as_of unchanged (use force_build to rebuild)"
